{% load static %}<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tux.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linux Distro Explorer | DistroPedia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind utilities compiled from the original config, then the app's
         own stylesheet — same cascade order as the Vite bundle had. -->
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}" />
    <link rel="stylesheet" href="{% static 'css/index.css' %}" />
    <!-- Bare specifiers the vendored three.js addons expect ('three'), plus a
         short alias for our own module tree so no build step is needed. -->
    <script type="importmap">
      {
        "imports": {
          "three": "{% static 'vendor/three.module.js' %}",
          "three/addons/": "{% static 'vendor/three/' %}",
          "dp/": "{% static 'js/' %}"
        }
      }
    </script>
    <!-- Markdown renderer for post/comment bodies (the .dp-md typography is
         unchanged); UMD build → window.marked. -->
    <script src="{% static 'vendor/marked.umd.js' %}"></script>
    <!-- The env() lookups the old Vite build inlined at compile time; the
         ported services read them from here instead of import.meta.env. -->
    <script>
      window.__dpConfig = {
        VITE_API_URL: "{{ api_url|escapejs }}",
        VITE_GOOGLE_CLIENT_ID: "{{ google_client_id|escapejs }}",
      };
    </script>
  </head>
  <body class="bg-[#161B22] text-[#F0F4F8] antialiased">
    <div id="root">
      <!-- The portal root HeroUIProvider rendered around the app; kept so the
           mounted DOM matches the React tree one-for-one. -->
      <div data-overlay-container="true">
        <main class="dark text-foreground bg-transparent min-h-screen"></main>
      </div>
    </div>
    <script type="module" src="{% static 'js/main.js' %}"></script>
  </body>
</html>
